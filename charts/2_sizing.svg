<line x1="60" x2="720" y1="330.0" y2="330.0" stroke="#e1e0d9"/><text x="52" y="334.0" font-size="11" fill="#52514e" text-anchor="end">100%</text>
<polyline points="60.0,456.6 192.0,444.5 324.0,444.5 456.0,444.5" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="5 4"/>
<polyline points="60.0,456.6 192.0,423.7 324.0,401.1 456.0,359.5 588.0,330.0 720.0,330.0" fill="none" stroke="#1baf7a" stroke-width="2.4"/>
<circle cx="60.0" cy="456.6" r="3.5" fill="#1baf7a"/>
<text x="60.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">1%</text><text x="60.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">2 bps/yr</text>
<circle cx="192.0" cy="423.7" r="3.5" fill="#1baf7a"/>
<text x="192.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">2%</text><text x="192.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">4 bps/yr</text>
<circle cx="324.0" cy="401.1" r="3.5" fill="#1baf7a"/>
<text x="324.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">3%</text><text x="324.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">6 bps/yr</text>
<circle cx="456.0" cy="359.5" r="3.5" fill="#1baf7a"/>
<text x="456.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">5%</text><text x="456.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">11 bps/yr</text>
<circle cx="588.0" cy="330.0" r="3.5" fill="#1baf7a"/>
<text x="588.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">7%</text><text x="588.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">15 bps/yr</text>
<circle cx="720.0" cy="330.0" r="3.5" fill="#1baf7a"/>
<text x="720.0" y="516" font-size="11" fill="#52514e" text-anchor="middle">10%</text><text x="720.0" y="530" font-size="10.5" fill="#898781" text-anchor="middle">21 bps/yr</text>
<text x="60" y="548" font-size="11" fill="#52514e">Target as a share of rETH value; below it, the yield rETH holders would give up if the buffer stayed full.</text>
<line x1="60" x2="82" y1="320" y2="320" stroke="#1baf7a" stroke-width="2.4"/><text x="88" y="324" font-size="11" fill="#52514e">Buffer full on May 1</text>
<line x1="230" x2="252" y1="320" y2="320" stroke="#898781" stroke-width="2" stroke-dasharray="5 4"/><text x="258" y="324" font-size="11" fill="#52514e">Higher target only, filled by flows as they happened (flat: nothing to fill it)</text>
</svg>