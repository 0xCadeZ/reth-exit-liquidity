<rect x="673.9" y="179.0" width="30.2" height="31.0" fill="#eb6834"/>
<text x="672.9" y="226" font-size="11" fill="#52514e" text-anchor="middle">Nov 1-12</text>
<rect x="60" y="236" width="10" height="10" fill="#2a78d6"/><text x="75" y="245" font-size="11" fill="#52514e">ETH in (node payouts, recycled deposits, mints)</text>
<rect x="350" y="236" width="10" height="10" fill="#eb6834"/><text x="365" y="245" font-size="11" fill="#52514e">Exit demand, empty days at funded-day burn rates (average of runs)</text>
<text x="60" y="304" font-size="12.5" font-weight="600" fill="#0b0b0b">Share of days every exit could be paid, by buffer target</text>
<line x1="60" x2="720" y1="500.0" y2="500.0" stroke="#e1e0d9"/><text x="52" y="504.0" font-size="11" fill="#52514e" text-anchor="end">50%</text>
