<rect x="547.4" y="40.0" width="30.2" height="170.0" fill="#2a78d6"/>
<rect x="579.6" y="89.5" width="30.2" height="120.5" fill="#eb6834"/>
<text x="563.5" y="52" font-size="10.5" fill="#0b0b0b" text-anchor="middle">75k</text>
