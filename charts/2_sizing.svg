<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="Buffer inflow against exit demand by month, and days with every exit paid by buffer target">
